databases:
  - name: realestateai-db
    databaseName: realestateai
    user: realestateai
    plan: free

services:
  - type: web
    name: realestateai-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: realestateai-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      # Comma-separated. Must include every deployed frontend origin.
      - key: Cors__AllowedOrigins
        value: http://localhost:4200,https://realestateai.netlify.app,https://realtorai.netlify.app,https://polite-paletas-4014d8.netlify.app
