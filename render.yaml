databases:
  - name: realestateai-db
    databaseName: realestateai
    user: realestateai
    plan: free

services:
  - type: web
    name: realestateai-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: realestateai-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      # Comma-separated. Update this to your real Netlify site URL after deploying.
      - key: Cors__AllowedOrigins
        value: https://realestateai.netlify.app,https://realtorai.netlify.app
      - key: Ai__ApiKey
        sync: false
      - key: WhatsApp__AccessToken
        sync: false
      - key: WhatsApp__PhoneNumberId
        sync: false
